<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stefan - Twój osobisty asystent prawny AI. Szybki, precyzyjny i zawsze dostępny." />
    <meta name="keywords" content="asystent prawny, AI, prawo, porady prawne, analiza dokumentów, szablony pism, konsultacje prawne" />
    <meta name="theme-color" content="#F8F9FA" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Stefan – Asystent Prawny KSeF dla Polskiej Kancelarii</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const isDevelopment = import.meta.env.DEV;
      const buildId = import.meta.env.VITE_STEFAN_BUILD_ID || 'development';

      if (isDevelopment && 'serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const hadController = Boolean(navigator.serviceWorker.controller);
        await Promise.all(registrations.map(registration => registration.unregister()));
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.filter(name => name.startsWith('stefan-')).map(name => caches.delete(name)));
        if (hadController) window.location.reload();
      } else if (!isDevelopment && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register(`/sw.js?build=${encodeURIComponent(buildId)}`, { updateViaCache: 'none' })
            .then(registration => {
              registration.update();
              console.log('SW registered: ', registration);
            })
            .catch(error => {
              console.log('SW registration failed: ', error);
            });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
